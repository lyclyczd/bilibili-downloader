<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; width: 300px;
         margin: 0; padding: 14px; color: #222; }
  h3 { margin: 0 0 10px; font-size: 15px; color: #fb7299; }
  input { width: 100%; box-sizing: border-box; padding: 7px; font-size: 12px;
          border: 1px solid #ddd; border-radius: 6px; }
  button { margin-top: 10px; width: 100%; padding: 9px; background: #fb7299;
           color: #fff; border: none; border-radius: 6px; font-size: 13px;
           cursor: pointer; }
  button:disabled { background: #ccc; cursor: default; }
  .status { margin-top: 10px; font-size: 12px; min-height: 16px;
             white-space: pre-wrap; line-height: 1.5; }
  .ok { color: #1a9e3e; } .err { color: #d33; }
  .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
  <h3>🅑 BiliDL 一键捕获</h3>
  <input id="base" value="http://127.0.0.1:8234" placeholder="BiliDL 地址" />
  <button id="capture">捕获当前页面并下载</button>
  <div id="status" class="status"></div>
  <div class="hint">需先启动 BiliDL（双击 exe，或运行 python bili_gui.py）。<br>
  支持视频 / 番剧 / 课程 / 直播间页面。</div>
  <script src="popup.js"></script>
</body>
</html>
